name: CI

# The chat window in jsdom, and the plugin inside a real WordPress (WordPress
# Playground: PHP as WebAssembly, no Docker) on PHP 8.3 and 7.4. Nothing here
# calls Magnus: the PHP tests answer every outgoing request themselves.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bin/test.sh
