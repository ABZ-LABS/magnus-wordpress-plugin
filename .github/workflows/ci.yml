name: CI

# The chat window in jsdom, and the plugin inside a real WordPress (WordPress
# Playground: PHP as WebAssembly, no Docker) on PHP 8.3 and 7.4. Nothing here
# calls Magnus: the PHP tests answer every outgoing request themselves.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bin/test.sh
